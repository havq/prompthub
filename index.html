
<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://www.gstatic.com/lamda/images/gemini_sparkle_4g_512_lt_f94943af3be039176192d.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompthub.Today | AI Prompt Gallery</title>
    <meta name="description" content="An application to display and manage a curated list of sample prompts for AI image generation." />
    <meta name="keywords" content="ai prompts, image generation, prompthub, midjourney, stable diffusion, art prompts, creative ai" />
    
    <!-- Performance Optimizations -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://res.cloudinary.com">
    <link rel="dns-prefetch" href="https://res.cloudinary.com">
    <link rel="dns-prefetch" href="https://api.dicebear.com">
    <link rel="dns-prefetch" href="https://i.ibb.co">
    
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_) {}
      })();
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/index.css" />
    <!-- <script src="https://cdn.tailwindcss.com/3.4.17?plugins=typography@0.5.16"></script> -->
    <script>

      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Lexend', 'sans-serif']
            },
            typography: ({ theme }) => ({
              DEFAULT: {
                css: {
                  '--tw-prose-body': theme('colors.gray.700'),
                  '--tw-prose-headings': theme('colors.gray.900'),
                  '--tw-prose-links': theme('colors.indigo.600'),
                  '--tw-prose-invert-body': theme('colors.gray.300'),
                  '--tw-prose-invert-headings': theme('colors.white'),
                  '--tw-prose-invert-links': theme('colors.indigo.400'),
                },
              },
            }),
            colors: {
              gray: {
                50: '#f9fafb',
                100: '#f3f4f6',
                200: '#e5e7eb',
                300: '#d1d5db',
                400: '#9ca3af',
                500: '#6b7280',
                600: '#4b5563',
                700: '#2a2e36', /* Tinh chỉnh để hợp với nền tối */
                800: '#1c1f26', /* Màu Card */
                900: '#131519', /* MÀU CHỦ ĐẠO MỚI */
                950: '#0b0c0f', /* Màu Footer */
              }
            },            
          }
        }
      }

    </script>

<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
